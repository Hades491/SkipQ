<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="100" height="100" rx="20" fill="#1B4332"/>
  <!-- basket handle -->
  <path d="M32 42 C32 26, 68 26, 68 42" stroke="#F2894A" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- basket body (trapezoid, wider at top) -->
  <path d="M24 42 L76 42 L69 74 C69 78, 65 80, 61 80 L39 80 C35 80, 31 78, 31 74 Z"
        fill="#F2894A" stroke="#C7601F" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- weave texture: verticals -->
  <line x1="38" y1="42" x2="35" y2="80" stroke="#C7601F" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="42" x2="50" y2="80" stroke="#C7601F" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="62" y1="42" x2="65" y2="80" stroke="#C7601F" stroke-width="2.5" stroke-linecap="round"/>
  <!-- weave texture: horizontal -->
  <path d="M27 54 L73 54" stroke="#C7601F" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M29 67 L71 67" stroke="#C7601F" stroke-width="2.5" stroke-linecap="round"/>
  <!-- rim highlight -->
  <rect x="22" y="39" width="56" height="7" rx="3.5" fill="#F6A46A"/>
</svg>
